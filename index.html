<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="theme-color" content="#0057ff" />
  <title>KSJP एडमिन पैनल</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" id="site-favicon" href="" type="image/png" />
  <link rel="apple-touch-icon" id="apple-touch-icon" href="" />

  <!-- चेकपॉइंट फ़ोल्डरों के अपने-अपने layout.css -->
  <link rel="stylesheet" href="./02-start-page/layout.css" />
  <link rel="stylesheet" href="./03-page-panel/layout.css" />
</head>
<body>
  <!-- चेकपॉइंट 2: बूट स्क्रीन -->
  <section class="boot-screen" id="boot-screen">
    <div class="card">
      <div class="badge" id="boot-badge"></div>
      <h1 id="boot-title"></h1>
      <p id="boot-sub"></p>
      <div id="status" class="status-box"></div>
      <div class="progress-track" id="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>
  </section>

  <!-- चेकपॉइंट 3: मुख्य एडमिन पैनल (जहाँ रनिंग स्टेटस पैनल भी दिखेगा) -->
  <section class="panel-screen" id="panel-screen" style="display:none;">
    <div id="ksjp-running-status-panel"></div>
  </section>

  <!-- 
    नक्शा बिल्कुल साफ: 
    index.html अब किसी भी अंदरूनी मॉड्यूल को नहीं जानती। 
    यह सीधे रूट फोल्डर में बैठे 'auto-loader.js' से बात करती है, 
    और ऑटो-लोडर बाकी सबको क्रमानुसार संभाल लेता है।
  -->
  <script type="module" src="./auto-loader.js"></script>
</body>
</html>
