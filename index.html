<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="theme-color" content="#0057ff" />
  <title>KSJP एडमिन पैनल</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" id="site-favicon" href="" type="image/png" />
  <link rel="apple-touch-icon" id="apple-touch-icon" href="" />

  <!-- चेकपॉइंट फ़ोल्डरों के अपने-अपने layout.css -->
  <link rel="stylesheet" href="./02-start-page/layout.css" />
  <link rel="stylesheet" href="./03-page-panel/layout.css" />
</head>
<body>
  <!-- चेकपॉइंट 2: बूट स्क्रीन -->
  <section class="boot-screen" id="boot-screen">
    <div class="card">
      <div class="badge" id="boot-badge"></div>
      <h1 id="boot-title"></h1>
      <p id="boot-sub"></p>
      <div id="status" class="status-box"></div>
      <div class="progress-track" id="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>
  </section>

  <!-- चेकपॉइंट 3: मुख्य एडमिन पैनल -->
  <section class="panel-screen" id="panel-screen" style="display:none;"></section>

  <script type="module">
    import { runStartPage } from "./02-start-page/execution/start.js";
    import { showAdminPanel } from "./03-page-panel/execution/panel-logic.js";

    // अपलोड की गई फ़ोटो को आइकॉन में लगाना
    (async () => {
      try {
        const res = await fetch("https://api.github.com/repos/Manishmanwala/ksjp-control-room/contents/");
        if (res.ok) {
          const files = await res.json();
          const foundLogo = files.find((f) =>
            f.type === "file" &&
            (f.name.startsWith("Screenshot_") || /\.(jpg|jpeg|png|webp)$/i.test(f.name))
          );
          if (foundLogo && foundLogo.download_url) {
            document.getElementById("site-favicon").href = foundLogo.download_url;
            document.getElementById("apple-touch-icon").href = foundLogo.download_url;
          }
        }
      } catch (e) {}
    })();

    runStartPage(async () => {
      await showAdminPanel();

      // सभी प्लग-इन मॉड्यूल सुरक्षित तरीके से लोड करना (कोई फ़ाइल न भी हो तो साइट नहीं रुकेगी)
      import("./06-voice-bridge/voice-system.js")
        .then((m) => m.initVoiceAndConferenceSystem?.())
        .catch(() => {});

      import("./05-new-members/new-members.js")
        .then((m) => m.initNewMembersApproval?.())
        .catch(() => {});

      import("./06-kick-member/kick-member.js")
        .then((m) => m.initKickMemberTool?.())
        .catch(() => {});
    });
  </script>
</body>
</html>
