<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="theme-color" content="#0057ff" />
  <title>KSJP एडमिन पैनल</title>

  <!-- मोबाइल शॉर्टकट और ऐप आइकॉन के लिए -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" id="site-favicon" href="./21481_2.jpg" type="image/jpeg" />
  <link rel="apple-touch-icon" id="apple-touch-icon" href="./21481_2.jpg" />

  <link rel="stylesheet" href="./02-start-page/layout.css" />
  <link rel="stylesheet" href="./03-page-panel/layout.css" />
  <style>
    body {
      background: #0f172a !important;
    }
  </style>
</head>
<body>
  <!-- पहला पेज: 3 सेकंड बूट स्क्रीन -->
  <section class="boot-screen" id="boot-screen">
    <div class="card">
      <div class="badge" id="boot-badge"></div>
      <h1 id="boot-title"></h1>
      <p id="boot-sub"></p>
      <div id="status" class="status-box"></div>
      <div class="progress-track" id="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>
  </section>

  <!-- दूसरा पेज: मुख्य KSJP एडमिन पैनल -->
  <section class="panel-screen" id="panel-screen" style="display:none;"></section>

  <script type="module">
    import { runStartPage } from "./02-start-page/execution/start.js";

    // अपलोड की गई Screenshot या लोगो फ़ोटो को ब्राउज़र और शॉर्टकट आइकॉन में लगाना
    (async () => {
      try {
        const res = await fetch("https://api.github.com/repos/Manishmanwala/ksjp-control-room/contents/");
        if (res.ok) {
          const files = await res.json();
          const foundLogo = files.find((f) =>
            f.type === "file" &&
            (f.name.startsWith("Screenshot_") || f.name === "21481_2.jpg" || /\.(jpg|jpeg|png|webp)$/i.test(f.name))
          );
          if (foundLogo && foundLogo.download_url) {
            document.getElementById("site-favicon").href = foundLogo.download_url;
            document.getElementById("apple-touch-icon").href = foundLogo.download_url;
          }
        }
      } catch (e) {}
    })();

    runStartPage(async () => {
      try {
        const mod = await import("./03-page-panel/execution/panel-logic.js");
        if (mod && mod.showAdminPanel) {
          document.body.style.background = "#e2e8f0";
          mod.showAdminPanel();
        }
      } catch (err) {}
    });
  </script>
</body>
</html>
